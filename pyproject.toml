

[tool.poetry]
name = "image-segmentation-thesis"
version = "0.1.0"
description = "Cell segmentation of Drosophila microglomeruli from confocal microscopy"
authors = ["rawat <aditya.rawat@rwth-aachen.de>"]
license = "MIT"
readme = "README.md"
package-mode = true

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
torch = "^2.9.0"
torchvision = "^0.24.0"
torchaudio = "^2.9.0"
segmentation-models-pytorch = "^0.5.0"
scikit-image = "^0.25.2"
opencv-python = "^4.12.0.88"
cellpose = "^4.0.7"
stardist = "^0.9.1"
jupyter = "^1.1.1"
ipykernel = "^7.0.1"
matplotlib = "^3.10.7"
seaborn = "^0.13.2"
pyvirtualdisplay = "^3.0"
czifile = "^2019.7.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
black = "^23.0"
ruff = "^0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
